# LEGACY: reference for the path-mounted deployment (BASE_PATH=/mc/link) behind
# a system nginx. Production now serves the app from the root of
# https://mc.smto.dev/ behind Traefik with BASE_PATH empty, where no prefix
# rewriting is needed: route /api/* to the backend and everything else to the
# frontend. Kept only for a path-mounted preview.
#
# Add these two locations to the existing smto.dev server block, alongside the
# ones the account system already has at /account/. nginx lives outside this
# repository; this is the reference for what it needs.
#
# The two rules are not symmetrical, and that is deliberate:
#
#   /mc/link/api/   the prefix is STRIPPED. The backend serves clean internal
#                   paths (/api/v1/..., /auth/...) and emits no absolute URLs of
#                   its own, so it has no reason to know where it is mounted.
#
#   /mc/link/       the prefix is KEPT. SvelteKit is built with
#                   paths.base = '/mc/link', so every link and asset URL it
#                   generates already carries it.
#
# Note the difference from the account system, which also passes its /account/oauth/
# prefix through untouched. That is because oidc-provider builds its advertised
# discovery URLs from the incoming request path. This service is only a client of
# that provider and hosts nothing of the sort, so its API can be mounted cleanly.

location /mc/link/api/ {
    proxy_pass http://127.0.0.1:3011/api/;

    # Server images are uploaded through the admin area, up to 8 MiB each. The
    # default is 1m, which would turn a background into a 413 from nginx that
    # the app never sees.
    client_max_body_size 12m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
}

location /mc/link/ {
    proxy_pass http://127.0.0.1:3010;

    # The upload form posts here, not to the API location above.
    client_max_body_size 12m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
}

# The forwarded headers above are required, not optional. The backend does
# app.set('trust proxy', 1) and adapter-node reads PROTOCOL_HEADER, HOST_HEADER
# and ADDRESS_HEADER with XFF_DEPTH: 1. Without them every caller looks like
# 127.0.0.1, which makes the rate limiting and the audit log useless.
#
# Ports 3010 and 3011 rather than 3000 and 3001, so this stack and the account
# system's can share a host without arguing over them.
#
# The /mc/link/api/ location has to come first, and it does: nginx prefers the
# longest matching prefix, so it wins over /mc/link/ regardless of the order
# they are written in. That matters because the SvelteKit app also answers
# /mc/link/api/v1/public/* itself, as a passthrough for a stack running without
# nginx in front (see frontend/src/routes/api/v1/public/[...path]/+server.ts).
# With this config in place nginx intercepts those requests first and the
# passthrough is never reached in production.
#
# The 12m above is deliberate and has a second half: adapter-node has its own
# body limit, 512 kB by default, so the frontend container also sets
# BODY_SIZE_LIMIT. Raising one without the other moves the rejection rather
# than removing it. Everything else this service takes is small; the biggest is
# a batch of 500 playtime entries, a few tens of kilobytes.
