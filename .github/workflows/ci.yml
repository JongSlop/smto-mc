name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything here talks to the throwaway service container below, never to
  # anything real. The suites rewrite the database name themselves.
  DATABASE_URL: postgresql://smto:smto@localhost:5432/smto_mc_link
  PUBLIC_ORIGIN: http://localhost:3010/mc/link
  OIDC_CLIENT_ID: smto-mc-link-ci
  OIDC_CLIENT_SECRET: ci-secret
  # 32 zero bytes, base64. Nothing real is ever encrypted with it.
  SESSION_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  # Empty switches the Microsoft path off, which is what CI wants: that chain
  # talks to Microsoft, Xbox Live and Mojang, none of which belong in a test run.
  MSA_CLIENT_SECRET: ''

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # A frozen install is exactly the kind that skips postinstall scripts, and
      # everything below reads the generated client's types. Generating only
      # reads the schema, never the database.
      - run: pnpm --filter @smto/mc-backend exec prisma generate

      # Before the checks, not after. Both apps import the compiled contracts,
      # and svelte-check reads the Paraglide output the frontend build emits, so
      # a clean checkout cannot typecheck until this has run.
      - run: pnpm build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    name: Backend end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: smto
          POSTGRES_PASSWORD: smto
          POSTGRES_DB: smto_mc_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smto/mc-contracts build
      - run: pnpm --filter @smto/mc-backend exec prisma generate

      # The suite points itself at smto_mc_link_test and expects it to be there.
      # The migration is what creates the partial unique indexes the linking
      # tests rely on, so this cannot be replaced with a db push.
      - name: Prepare the test database
        env:
          PGPASSWORD: smto
        run: |
          psql -h localhost -U smto -d postgres -c 'CREATE DATABASE smto_mc_link_test'
          DATABASE_URL=postgresql://smto:smto@localhost:5432/smto_mc_link_test \
            pnpm --filter @smto/mc-backend exec prisma migrate deploy

      - run: pnpm --filter @smto/mc-backend test:e2e
        env:
          DATABASE_URL: postgresql://smto:smto@localhost:5432/smto_mc_link_test

  browser:
    name: Browser end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: smto
          POSTGRES_PASSWORD: smto
          POSTGRES_DB: smto_mc_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smto/mc-contracts build
      - run: pnpm --filter @smto/mc-backend exec prisma generate
      - run: pnpm --filter @smto/mc-backend exec prisma migrate deploy
      # The landing page asserts a seeded server is listed, so the seed is part
      # of preparing the stack rather than an extra.
      - run: pnpm --filter @smto/mc-backend seed
      - run: pnpm build

      - run: pnpm --filter @smto/mc-e2e exec playwright install --with-deps chromium

      # The browser suite only covers what a signed out visitor sees. Everything
      # past the sign in button needs a real authorization at the account
      # system, which a CI run cannot do; those endpoints are covered by the
      # backend suite instead.
      #
      # PORT is set per process, not on the step: both servers read it, and one
      # value for both would put them on the same port.
      - name: Start the stack
        run: |
          PORT=3011 node backend/dist/main.js &
          PORT=3010 ORIGIN=http://127.0.0.1:3010 BACKEND_INTERNAL_URL=http://127.0.0.1:3011 \
            node frontend/build/index.js &
          npx --yes wait-on http://127.0.0.1:3011/health http://127.0.0.1:3010/mc/link/

      # E2E_BASE_URL is the origin only; the specs carry the /mc/link prefix
      # themselves. See the comment in e2e/playwright.config.ts.
      - run: pnpm test:browser
        env:
          E2E_BASE_URL: http://127.0.0.1:3010

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  publish:
    name: Publish images
    # Only green code reaches the registry, because the server pulls from it
    # without a human in between.
    needs: [checks, backend, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # `main` is the tag the server follows. The sha tag exists so a bad
          # deploy can be pinned back to a known good build by name.
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
